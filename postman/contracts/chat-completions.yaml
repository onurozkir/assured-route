openapi: 3.0.3
info:
  title: Chat Completions integration subset
  version: 1.0.0
  description: >-
    Local contract subset used by Assured Route. Based on the official OpenAI
    Chat Completions contract; not a full vendor specification or compatibility guarantee.
servers:
  - url: https://llm.example/v1
paths:
  /chat/completions:
    post:
      operationId: createChatCompletion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [system, user, assistant]
                      content:
                        type: string
                max_completion_tokens:
                  type: integer
                  minimum: 1
                max_tokens:
                  type: integer
                  minimum: 1
                response_format:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [json_object]
      responses:
        '200':
          description: Completed chat response; application must still validate content JSON.
          content:
            application/json:
              schema:
                type: object
                required: [model, choices]
                properties:
                  model:
                    type: string
                  choices:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required: [finish_reason, message]
                      properties:
                        finish_reason:
                          type: string
                          enum: [stop, length, content_filter, tool_calls]
                        message:
                          type: object
                          properties:
                            content:
                              type: string
                              nullable: true
                            refusal:
                              type: string
                              nullable: true
              example:
                model: simulation-snapshot
                choices:
                  - finish_reason: stop
                    message:
                      content: '{"document_type":"invoice"}'
                      refusal: null
        '401':
          description: Authentication failed.
        '429':
          description: Provider rate limit exceeded.
        '500':
          description: Upstream failure.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
